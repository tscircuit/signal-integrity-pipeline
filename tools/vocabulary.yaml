  # irregular plurals the checker cannot reduce
  - indices matrices stimuli
  # other everyday words
  - seed

avoid:
  centre: center
  col: column
  ctx: context
  eps: epsilon
  hi: high
  lo: low
  mid: middle
  neg: negative
  num: number
  polys: polygon
  pos: positive
  pts: point
  refs: reference
  src: source
  tris: triangle
