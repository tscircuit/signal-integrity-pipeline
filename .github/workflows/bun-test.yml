# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: models
          key: vendor-ibis-models-${{ hashFiles('examples/vendor-models.lock.json') }}
      - run: bun run fetch:vendor-models

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice=42+ds-3build1
          ngspice --version

      - name: Run tests
        run: bun test
        env:
          IBIS_MODEL_DIR: models


