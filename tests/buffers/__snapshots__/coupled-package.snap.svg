<svg width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,3.1 9,3.1" data-type="line" data-label="" points="55.47128927410614,358.00650054171183 1050.0541711809317,358.00650054171183" fill="none" stroke="#1a5ba9" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="0,1.45 9,1.45" data-type="line" data-label="" points="55.47128927410614,540.3466955579632 1050.0541711809317,540.3466955579632" fill="none" stroke="#1a5ba9" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="1.45,3.1 1.45,2.42" data-type="line" data-label="" points="215.7096424702058,358.00650054171183 215.7096424702058,433.15276273022755" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="1.27,2.42 1.63,2.42" data-type="line" data-label="" points="195.8179848320693,433.15276273022755 235.60130010834231,433.15276273022755" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="1.27,2.19 1.63,2.19" data-type="line" data-label="" points="195.8179848320693,458.569880823402 235.60130010834231,458.569880823402" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="1.45,2.19 1.45,1.45" data-type="line" data-label="" points="215.7096424702058,458.569880823402 215.7096424702058,540.3466955579632" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="7.55,3.1 7.55,2.42" data-type="line" data-label="" points="889.8158179848319,358.00650054171183 889.8158179848319,433.15276273022755" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="7.37,2.42 7.73,2.42" data-type="line" data-label="" points="869.9241603466955,433.15276273022755 909.7074756229686,433.15276273022755" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="7.37,2.19 7.73,2.19" data-type="line" data-label="" points="869.9241603466955,458.569880823402 909.7074756229686,458.569880823402" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="7.55,2.19 7.55,1.45" data-type="line" data-label="" points="889.8158179848319,458.569880823402 889.8158179848319,540.3466955579632" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.315276273022752"/></g><g><polyline data-points="4.5,1.16 4.5,3.4" data-type="line" data-label="" points="552.7627302275189,572.3943661971832 552.7627302275189,324.85373781148434" fill="none" stroke="#b6c8e1" stroke-linejoin="round" stroke-width="2.210184182015168" stroke-dasharray="5 5"/></g><g><rect data-type="rect" data-label="" data-x="4.5" data-y="3.1" x="382.57854821235094" y="330.3791982665222" width="340.36836403033595" height="55.25460455037921" fill="#eef4fb" stroke="#1a5ba9" stroke-width="0.009049019607843137"/></g><g><rect data-type="rect" data-label="" data-x="4.5" data-y="1.45" x="382.57854821235094" y="512.7193932827736" width="340.36836403033595" height="55.25460455037921" fill="#eef4fb" stroke="#1a5ba9" stroke-width="0.009049019607843137"/></g><text data-type="text" data-label="Coupled IBIS package" data-x="4.5" data-y="4.75" x="552.7627302275189" y="175.66630552546053" fill="black" font-size="27.6273022751896" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Coupled IBIS package</text><text data-type="text" data-label="Board pins" data-x="0.4" data-y="4.05" x="99.6749729144095" y="253.0227518959914" fill="#1a5ba9" font-size="19.89165763813651" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Board pins</text><text data-type="text" data-label="Die pads" data-x="8.6" data-y="4.05" x="1005.8504875406284" y="253.0227518959914" fill="#1a5ba9" font-size="19.89165763813651" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Die pads</text><text data-type="text" data-label="A1" data-x="0" data-y="3.35" x="55.47128927410614" y="330.3791982665222" fill="black" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">A1</text><text data-type="text" data-label="A1" data-x="9" data-y="3.35" x="1050.0541711809317" y="330.3791982665222" fill="black" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">A1</text><text data-type="text" data-label="1 Ω · 2 nH" data-x="4.5" data-y="3.1" x="552.7627302275189" y="358.00650054171183" fill="black" font-size="18.78656554712893" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 Ω · 2 nH</text><text data-type="text" data-label="B1" data-x="0" data-y="1.7" x="55.47128927410614" y="512.7193932827736" fill="black" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">B1</text><text data-type="text" data-label="B1" data-x="9" data-y="1.7" x="1050.0541711809317" y="512.7193932827736" fill="black" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">B1</text><text data-type="text" data-label="2 Ω · 4 nH" data-x="4.5" data-y="1.45" x="552.7627302275189" y="540.3466955579632" fill="black" font-size="18.78656554712893" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2 Ω · 4 nH</text><text data-type="text" data-label="Mutual R and L" data-x="4.5" data-y="2.38" x="552.7627302275189" y="437.5731310942579" fill="black" font-size="17.681473456121346" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Mutual R and L</text><text data-type="text" data-label="0.25 pF" data-x="2.1" data-y="2.3" x="287.5406283856988" y="446.4138678223186" fill="#a14324" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.25 pF</text><text data-type="text" data-label="0.25 pF" data-x="8.22" data-y="2.3" x="963.8569880823402" y="446.4138678223186" fill="#a14324" font-size="16.576381365113757" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.25 pF</text><text data-type="text" data-label="Half of the mutual capacitance appears at each end." data-x="4.5" data-y="0.65" x="552.7627302275189" y="628.7540628385699" fill="black" font-size="18.78656554712893" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Half of the mutual capacitance appears at each end.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":110.5092091007584,"c":0,"e":55.47128927410614,"b":0,"d":-110.5092091007584,"f":700.5850487540629};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>