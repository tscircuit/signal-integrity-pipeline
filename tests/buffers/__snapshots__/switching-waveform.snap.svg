22224039247 267.7105478331971,718.2011447260834 352.4856909239575,718.2011447260834 390.1635322976288,712.130067048242 427.8413736713001,608.92068683565 465.5192150449714,517.8536974652494 503.1970564186427,523.9247751430908 587.9721995094031,523.9247751430908 625.6500408830746,529.9959705641863 663.3278822567457,633.2052330335241 701.005723630417,724.2722224039247 738.6835650040883,718.2011447260834 823.4587080948488,718.2011447260834 861.1365494685201,712.130067048242 898.8143908421913,608.92068683565 936.4922322158626,517.8536974652494 974.170073589534,523.9247751430908 1011.8479149632052,523.9247751430908 1058.9452166802944,523.9247751430908" fill="none" stroke="#a14324" stroke-linejoin="round" stroke-width="3.5322976287816843"/></g><g><rect data-type="rect" data-label="" data-x="4.8" data-y="3.9" x="305.3883892068684" y="257.94276369582997" width="753.556827473426" height="2.1193785772689466" fill="#dae8fa" stroke="black" stroke-width="0.008493055555555556"/></g><g><rect data-type="rect" data-label="" data-x="4.8" data-y="4.8" x="305.3883892068684" y="151.97383483237934" width="753.556827473426" height="2.119378577269117" fill="#f8dfd6" stroke="black" stroke-width="0.008493055555555556"/></g><text data-type="text" data-label="Measured rising waveform" data-x="4" data-y="5.65" x="587.9721995094031" y="52.951757972199516" fill="black" font-size="25.903515944399018" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Measured rising waveform</text><text data-type="text" data-label="Shading marks ±1% of each fixture swing" data-x="4" data-y="5.32" x="587.9721995094031" y="91.80703188879795" fill="#526177" font-size="17.66148814390842" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Shading marks ±1% of each fixture swing</text><text data-type="text" data-label="1.5 V" data-x="-0.45" data-y="4.8" x="64.01471790678664" y="153.0335241210139" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1.5 V</text><text data-type="text" data-label="0 V" data-x="-0.45" data-y="3" x="64.01471790678664" y="364.9713818479149" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0 V</text><text data-type="text" data-label="0.8 ns cutoff" data-x="1.6" data-y="2.71" x="305.3883892068684" y="399.1169255928046" fill="black" font-size="17.66148814390842" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.8 ns cutoff</text><text data-type="text" data-label="4 ns" data-x="7.72" data-y="2.71" x="1025.9771054783319" y="399.1169255928046" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">4 ns</text><text data-type="text" data-label="Scheduled switching coefficients" data-x="4" data-y="2.31" x="587.9721995094031" y="446.2142273098937" fill="black" font-size="25.903515944399018" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Scheduled switching coefficients</text><text data-type="text" data-label="1" data-x="-0.45" data-y="1.65" x="64.01471790678664" y="523.9247751430908" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1</text><text data-type="text" data-label="0" data-x="-0.45" data-y="0" x="64.01471790678664" y="718.2011447260834" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0</text><text data-type="text" data-label="0 ns" data-x="0" data-y="-0.29" x="116.9991823385119" y="752.346688470973" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0 ns</text><text data-type="text" data-label="1.25 ns" data-x="2" data-y="-0.29" x="352.4856909239575" y="752.346688470973" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1.25 ns</text><text data-type="text" data-label="5 ns" data-x="7.72" data-y="-0.29" x="1025.9771054783319" y="752.346688470973" fill="black" font-size="15.306623058053965" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">5 ns</text><text data-type="text" data-label="Pullup" data-x="6.7" data-y="2" x="905.8789860997548" y="482.71463614063777" fill="#1a5ba9" font-size="16.484055600981193" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Pullup</text><text data-type="text" data-label="Pulldown" data-x="7.6" data-y="2" x="1011.8479149632052" y="482.71463614063777" fill="#a14324" font-size="16.484055600981193" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Pulldown</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":117.74325429272281,"c":0,"e":116.9991823385119,"b":0,"d":-117.74325429272281,"f":718.2011447260834};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>