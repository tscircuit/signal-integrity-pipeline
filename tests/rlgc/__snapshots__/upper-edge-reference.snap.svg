0.099681,1.595491 -0.099986,1.595491" data-type="line" data-label="" points="518.9637912087912,101.41165750915746 518.8688278388279,101.41165750915746" fill="none" stroke="#2b303b" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-0.099986,1.595491 -0.1,1.595491" data-type="line" data-label="" points="518.8688278388279,101.41165750915746 518.8644688644689,101.41165750915746" fill="none" stroke="#728299" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="0.1,1.560491 0.1,1.560918" data-type="line" data-label="" points="581.1355311355311,112.30909340659332 581.1355311355311,112.17614468864463" fill="none" stroke="#2b303b" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="0.1,1.560918 0.1,1.577991" data-type="line" data-label="" points="581.1355311355311,112.17614468864463 581.1355311355311,106.86037545787542" fill="none" stroke="#728299" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="0.1,1.577991 0.1,1.595065" data-type="line" data-label="" points="581.1355311355311,106.86037545787542 581.1355311355311,101.54429487179482" fill="none" stroke="#2b303b" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="0.1,1.595065 0.1,1.595491" data-type="line" data-label="" points="581.1355311355311,101.54429487179482 581.1355311355311,101.41165750915746" fill="none" stroke="#728299" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-0.1,1.595491 -0.1,1.595065" data-type="line" data-label="" points="518.8644688644689,101.41165750915746 518.8644688644689,101.54429487179482" fill="none" stroke="#2b303b" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-0.1,1.595065 -0.1,1.577991" data-type="line" data-label="" points="518.8644688644689,101.54429487179482 518.8644688644689,106.86037545787542" fill="none" stroke="#728299" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-0.1,1.577991 -0.1,1.560918" data-type="line" data-label="" points="518.8644688644689,106.86037545787542 518.8644688644689,112.17614468864463" fill="none" stroke="#2b303b" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-0.1,1.560918 -0.1,1.560491" data-type="line" data-label="" points="518.8644688644689,112.17614468864463 518.8644688644689,112.30909340659332" fill="none" stroke="#728299" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><polyline data-points="-1.2,0 1.2,0" data-type="line" data-label="" points="176.3736263736264,598.1762545787545 923.6263736263736,598.1762545787545" fill="none" stroke="#263758" stroke-linejoin="round" stroke-width="7.783882783882785"/></g><g><polyline data-points="-0.5,-0.18 0.5,-0.18" data-type="line" data-label="" points="394.3223443223443,654.2202106227106 705.6776556776557,654.2202106227106" fill="none" stroke="#263758" stroke-linejoin="round" stroke-width="3.7362637362637363"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="1.577991" x="518.8644688644689" y="101.41165750915744" width="62.27106227106219" height="10.897435897435969" fill="#b35a25" stroke="black" stroke-width="0.0032117647058823528"/></g><text data-type="text" data-label="Bottom wire beside an upper reference edge" data-x="0" data-y="0.32" x="550" y="498.5425549450549" fill="black" font-size="40.476190476190474" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Bottom wire beside an upper reference edge</text><text data-type="text" data-label="1 mm" data-x="0" data-y="-0.28" x="550" y="685.3557417582417" fill="black" font-size="26.465201465201467" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 mm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":311.35531135531136,"c":0,"e":550,"b":0,"d":-311.35531135531136,"f":598.1762545787545};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>