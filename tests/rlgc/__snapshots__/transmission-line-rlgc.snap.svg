1451153968 942.0904204868796,343.8525134366109 940.7850142269997,342.4536832121404 939.479687006007,341.1645589630099 938.1742807461271,340.0346980714512 936.8689535251344,339.1073348087259 935.5636263041415,338.4182737907051 934.2582200442616,337.99399304457796 932.9528928232689,337.85069554220684 931.6475656022762,337.99399304457796 930.3421593423964,338.4182737907051 929.0368321214037,339.1073348087259 927.731504900411,340.0346980714512 926.4260986405311,341.1645589630099 925.1207714195384,342.4536832121404 923.8153651596585,343.8525134366109 922.5100379386658,345.3071451153968" fill="rgba(192, 132, 252, 0.8)" stroke="none" stroke-width="0.012652"/></g><text data-type="text" data-label="131 Ω" data-x="6.461517" data-y="-0.543764" x="922.5100379386658" y="456.81030667088214" fill="rgb(163, 230, 53)" font-size="11.857730003161555" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">131 Ω</text><text data-type="text" data-label="131 Ω" data-x="6.725763" data-y="-0.731294" x="943.3957477078723" y="471.63246917483406" fill="rgb(163, 230, 53)" font-size="11.857730003161555" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">131 Ω</text><text data-type="text" data-label="118 Ω" data-x="5.8971" data-y="-2.37005" x="877.8991463800189" y="601.1579196964907" fill="#8b97a6" font-size="11.010749288650015" font-family="sans-serif" text-anchor="end" dominant-baseline="central">118 Ω</text><text data-type="text" data-label="145 Ω" data-x="7.29018" data-y="-2.37005" x="988.0066392665192" y="601.1579196964907" fill="#8b97a6" font-size="11.010749288650015" font-family="sans-serif" text-anchor="start" dominant-baseline="central">145 Ω</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":79.03888713246917,"c":0,"e":411.798925071135,"b":0,"d":-79.03888713246917,"f":413.83180524818215};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>