lygon" data-label="" data-points="-0.032928,-0.112896 0.032928,-0.112896 0.032928,0.462896 -0.032928,0.462896" points="547.2377898739841,288.8821116993513 552.7622101260159,288.8821116993513 552.7622101260159,240.58101558422192 547.2377898739841,240.58101558422192" fill="#fbbf24" stroke="#0b0f13" stroke-width="0.6313287599731563"/></g><g><polygon data-type="polygon" data-label="k 0.501" data-points="-0.116902,-3.37704 -0.102289,-3.318195 -0.087676,-3.261612 -0.073064,-3.209465 -0.058451,-3.163757 -0.043838,-3.126246 -0.029225,-3.098373 -0.014613,-3.081208 0,-3.075413 0.014613,-3.081208 0.029225,-3.098373 0.043838,-3.126246 0.058451,-3.163757 0.073064,-3.209465 0.087676,-3.261612 0.102289,-3.318195 0.116902,-3.37704 0.116902,-3.37704 0.102289,-3.362686 0.087676,-3.348884 0.073064,-3.336164 0.058451,-3.325014 0.043838,-3.315864 0.029225,-3.309065 0.014613,-3.304878 0,-3.303465 -0.014613,-3.304878 -0.029225,-3.309065 -0.043838,-3.315864 -0.058451,-3.325014 -0.073064,-3.336164 -0.087676,-3.348884 -0.102289,-3.362686 -0.116902,-3.37704" points="540.1935165162926,562.699276713146 541.4193479233465,557.7629837446872 542.6451793304004,553.0164417269406 543.8709268510923,548.6420196107672 545.0967582581463,544.8077417791364 546.3225896652002,541.6610804563418 547.5484210722541,539.3229158899411 548.7741685929461,537.883006487212 550,537.3968850197599 551.2258314070539,537.883006487212 552.4515789277459,539.3229158899411 553.6774103347998,541.6610804563418 554.9032417418537,544.8077417791364 556.1290731489077,548.6420196107672 557.3548206695996,553.0164417269406 558.5806520766535,557.7629837446872 559.8064834837074,562.699276713146 559.8064834837074,562.699276713146 558.5806520766535,561.4951718738349 557.3548206695996,560.3373723063157 556.1290731489077,559.2703377824174 554.9032417418537,558.3350048467676 553.6774103347998,557.567444635001 552.4515789277459,556.9971012601595 551.2258314070539,556.6458690627097 550,556.5273376332862 548.7741685929461,556.6458690627097 547.5484210722541,556.9971012601595 546.3225896652002,557.567444635001 545.0967582581463,558.3350048467676 543.8709268510923,559.2703377824174 542.6451793304004,560.3373723063157 541.4193479233465,561.4951718738349 540.1935165162926,562.699276713146" fill="rgba(192, 132, 252, 0.8)" stroke="none" stroke-width="0.011920888888888889"/></g><text data-type="text" data-label="131 Ω" data-x="0.116902" data-y="-4.83528" x="559.8064834837074" y="685.0257251509954" fill="rgb(163, 230, 53)" font-size="22.097681008127655" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">131 Ω</text><text data-type="text" data-label="118 Ω" data-x="-1.97568" data-y="-5.49384" x="384.26739243904257" y="740.2699276713145" fill="#8b97a6" font-size="20.519275221832824" font-family="sans-serif" text-anchor="end" dominant-baseline="central">118 Ω</text><text data-type="text" data-label="145 Ω" data-x="1.97568" data-y="-5.49384" x="715.7326075609574" y="740.2699276713145" fill="#8b97a6" font-size="20.519275221832824" font-family="sans-serif" text-anchor="start" dominant-baseline="central">145 Ω</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":83.88636194168966,"c":0,"e":550,"b":0,"d":-83.88636194168966,"f":279.4116769815823};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>