<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="0,-3 0,3" data-type="line" data-label="" points="320,453.65000000000003 320,213.65000000000003" fill="none" stroke="#cbd5e1" stroke-linejoin="round" stroke-width="12.549999999999999"/></g><g><polyline data-points="0.3,-3 0.2999999,3" data-type="line" data-label="" points="332,453.65000000000003 331.999996,213.65000000000003" fill="none" stroke="#cbd5e1" stroke-linejoin="round" stroke-width="12.549999999999999"/></g><g><polyline data-points="0.30000000000000004,-2.999999995000001 0.2999999,3.000000004999999" data-type="line" data-label="top wire · GND (bottom)" points="332,453.64999980000005 331.999996,213.64999980000007" fill="none" stroke="#0369a1" stroke-linejoin="round" stroke-width="8"/></g><g><polyline data-points="0.41400000000000003,-2.9999999931000008 0.5015000000000001,-2.9999999916416678" data-type="line" data-label="" points="336.56,453.64999972400005 340.06,453.64999966566677" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="0.18600000000000005,-2.999999996900001 0.09850000000000003,-2.999999998358334" data-type="line" data-label="" points="327.44,453.6499998760001 323.94,453.6499999343334" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="0.4139999,3.0000000068999992 0.5014999,3.0000000083583322" data-type="line" data-label="" points="336.559996,213.64999972400005 340.059996,213.64999966566674" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="0.1859999,3.000000003099999 0.09849989999999997,3.000000001641666" data-type="line" data-label="" points="327.439996,213.6499998760001 323.939996,213.64999993433338" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="0,-3 0,3" data-type="line" data-label="top wire · GND (bottom)" points="320,453.65000000000003 320,213.65000000000003" fill="none" stroke="#0369a1" stroke-linejoin="round" stroke-width="8"/></g><g><polyline data-points="0.114,-3 0.2015,-3" data-type="line" data-label="" points="324.56,453.65000000000003 328.06,453.65000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="-0.114,-3 -0.2015,-3" data-type="line" data-label="" points="315.44,453.65000000000003 311.94,453.65000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="0.114,3 0.2015,3" data-type="line" data-label="" points="324.56,213.65000000000003 328.06,213.65000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="-0.114,3 -0.2015,3" data-type="line" data-label="" points="315.44,213.65000000000003 311.94,213.65000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polygon data-type="polygon" data-label="" data-points="-7,-5 7,-5 7,5 -7,5" points="40,533.6500000000001 600,533.6500000000001 600,133.65000000000003 40,133.65000000000003" fill="none" stroke="#cbd5e1" stroke-width="1.4"/></g><g><polygon data-type="polygon" data-label="" data-points="-6.8,-4.8 6.8,-4.8 6.8,4.8 -6.8,4.8" points="48,525.6500000000001 592,525.6500000000001 592,141.65000000000003 48,141.65000000000003" fill="rgba(219,39,119,0.06)" stroke="#a45a70" stroke-width="0.8399999999999999"/></g><circle data-type="circle" data-label="" data-x="0" data-y="-3" cx="320" cy="453.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0" data-y="-3" cx="320" cy="453.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0" data-y="3" cx="320" cy="213.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0" data-y="3" cx="320" cy="213.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0.3" data-y="-3" cx="332" cy="453.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0.3" data-y="-3" cx="332" cy="453.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0.2999999" data-y="3" cx="331.999996" cy="213.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0.2999999" data-y="3" cx="331.999996" cy="213.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><text data-type="text" data-label="Copper geometry extraction" data-x="-7" data-y="5.6825" x="40" y="106.35000000000002" fill="#0f172a" font-size="18.9" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Copper geometry extraction</text><text data-type="text" data-label="Ticks mark section boundaries. Circles mark pad contacts and vias. Dashes mark ideal joins." data-x="-7" data-y="5.2975" x="40" y="121.75000000000003" fill="#475569" font-size="10.149999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Ticks mark section boundaries. Circles mark pad contacts and vias. Dashes mark ideal joins.</text><text data-type="text" data-label="top · GND (bottom)" data-x="-0.25749999999999995" data-y="-4.291666666790075e-9" x="309.7" y="333.6500001716667" fill="#0369a1" font-size="11.549999999999997" font-family="sans-serif" text-anchor="end" dominant-baseline="central">top · GND (bottom)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40,"c":0,"e":320,"b":0,"d":-40,"f":333.65000000000003};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>