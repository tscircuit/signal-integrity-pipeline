idth="1.26"/></g><g><polyline data-points="-1.686006,0.189 -1.686006,0.27649999999999997" data-type="line" data-label="" points="252.55976,326.09000000000003 252.55976,322.59000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="1.686006,-0.189 1.686006,-0.27649999999999997" data-type="line" data-label="" points="387.44024,341.21000000000004 387.44024,344.71000000000004" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="1.686006,0.189 1.686006,0.27649999999999997" data-type="line" data-label="" points="387.44024,326.09000000000003 387.44024,322.59000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="1.686006,0 6,0" data-type="line" data-label="top wire · GND (bottom)" points="387.44024,333.65000000000003 560,333.65000000000003" fill="none" stroke="#047857" stroke-linejoin="round" stroke-width="14"/></g><g><polyline data-points="1.686006,-0.189 1.686006,-0.27649999999999997" data-type="line" data-label="" points="387.44024,341.21000000000004 387.44024,344.71000000000004" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="1.686006,0.189 1.686006,0.27649999999999997" data-type="line" data-label="" points="387.44024,326.09000000000003 387.44024,322.59000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="6,-0.189 6,-0.27649999999999997" data-type="line" data-label="" points="560,341.21000000000004 560,344.71000000000004" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polyline data-points="6,0.189 6,0.27649999999999997" data-type="line" data-label="" points="560,326.09000000000003 560,322.59000000000003" fill="none" stroke="#0f172a" stroke-linejoin="round" stroke-width="1.26"/></g><g><polygon data-type="polygon" data-label="" data-points="-7,-5 7,-5 7,5 -7,5" points="40,533.6500000000001 600,533.6500000000001 600,133.65000000000003 40,133.65000000000003" fill="none" stroke="#cbd5e1" stroke-width="1.4"/></g><g><polygon data-type="polygon" data-label="" data-points="6.8,-4.8 6.8,4.8 -6.8,4.8 -6.8,-4.8 6.8,-4.8 0,-1.248893 -1.686006,0 0,1.248893 1.686006,0 0,-1.248893 6.8,-4.8" points="592,525.6500000000001 592,141.65000000000003 48,141.65000000000003 48,525.6500000000001 592,525.6500000000001 320,383.60572 252.55976,333.65000000000003 320,283.69428000000005 387.44024,333.65000000000003 320,383.60572 592,525.6500000000001" fill="rgba(219,39,119,0.06)" stroke="none" stroke-width="0.8399999999999999"/></g><g><polygon data-type="polygon" data-label="" data-points="6.8,-4.8 6.8,4.8 -6.8,4.8 -6.8,-4.8" points="592,525.6500000000001 592,141.65000000000003 48,141.65000000000003 48,525.6500000000001" fill="none" stroke="#a45a70" stroke-width="0.8399999999999999"/></g><g><polygon data-type="polygon" data-label="" data-points="0,-1.248893 -1.686006,0 0,1.248893 1.686006,0" points="320,383.60572 252.55976,333.65000000000003 320,283.69428000000005 387.44024,333.65000000000003" fill="none" stroke="#a45a70" stroke-width="0.8399999999999999"/></g><circle data-type="circle" data-label="" data-x="-6" data-y="0" cx="80" cy="333.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="-6" data-y="0" cx="80" cy="333.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="6" data-y="0" cx="560" cy="333.65000000000003" r="3.5" fill="#0f172a" stroke="black" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="6" data-y="0" cx="560" cy="333.65000000000003" r="2.1" fill="white" stroke="black" stroke-width="0.025"/><text data-type="text" data-label="Copper geometry extraction" data-x="-7" data-y="5.6825" x="40" y="106.35000000000002" fill="#0f172a" font-size="18.9" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Copper geometry extraction</text><text data-type="text" data-label="Ticks mark section boundaries. Circles mark pad contacts and vias. Dashes mark ideal joins." data-x="-7" data-y="5.2975" x="40" y="121.75000000000003" fill="#475569" font-size="10.149999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Ticks mark section boundaries. Circles mark pad contacts and vias. Dashes mark ideal joins.</text><text data-type="text" data-label="top · GND (bottom)" data-x="-3.843003" data-y="0.3325" x="166.27988" y="320.35" fill="#0369a1" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">top · GND (bottom)</text><text data-type="text" data-label="top · GND edge (bottom)" data-x="0" data-y="0.3325" x="320" y="320.35" fill="#b45309" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">top · GND edge (bottom)</text><text data-type="text" data-label="top · GND (bottom)" data-x="3.843003" data-y="0.3325" x="473.72012" y="320.35" fill="#047857" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">top · GND (bottom)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40,"c":0,"e":320,"b":0,"d":-40,"f":333.65000000000003};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>